# service_type should be NodePort, ClusterIP, or LoadBalancer.
service_type: ClusterIP
replicas: 2

pod:
  image: noamyonassi/flask-aws-monitor
  # Jenkins overrides this with the BUILD_NUMBER tag pushed by the pipeline.
  tag: "latest"
  pull_policy: Always
  target_port: 5001
  port: 5001

config:
  gunicorn_workers: 2
  gunicorn_threads: 4

ingress:
  enabled: false
  class_name: nginx
  host: flask-monitor.local
